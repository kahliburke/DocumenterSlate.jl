name: Documentation

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      # The first build renders the notebooks (starting an isolated Kaimon host); the other two find
      # the bundles current. The same sources are built by three writers, each deployed to its own path.
      - name: Vitepress → /
        run: julia --project=docs docs/make.jl
        env:
          DOCS_FLAVOR: vitepress
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Documenter HTML → /html/
        run: julia --project=docs docs/make.jl
        env:
          DOCS_FLAVOR: html
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: MaterialDocs → /material/
        run: julia --project=docs docs/make.jl
        env:
          DOCS_FLAVOR: material
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      # A render that fails inside the Kaimon host leaves its reasons in the host's and the Slate
      # extension's logs, which disappear with the runner.
      - name: Kaimon host logs
        if: failure()
        run: |
          find ~/.cache/kaimonslate /tmp -path '*kaimon*' -name '*.log' 2>/dev/null | while read -r f; do
            echo "::group::$f"; tail -n 150 "$f"; echo "::endgroup::"
          done
